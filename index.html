<!DOCTYPE html>
<html>
<head>
    <title>Sample HTML Program</title>
</head>
<body>
    <h1>Welcome to My Page hello</h1>
    <p>This is a sample HTML program demonstrating basic elements.</p>

    <h2>List Example</h2>
    <ul>
        <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
    </ul>

    <h2>Link Example</h2>
    <p>Visit <a href="https://www.example.com">Example Website</a></p>

    <h2>Image Example</h2>
    <img src="https://via.placeholder.com/150" alt="Sample Image">

    <h2>Table Example</h2>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Alice</td>
            <td>25</td>
        </tr>
        <tr>
            <td>Bob</td>
            <td>30</td>
        </tr>
    </table>
</body>
</html>
